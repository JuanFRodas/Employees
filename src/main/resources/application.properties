# Puerto dinámico que Render asigna
server.port=${PORT:8080}

spring.application.name=crud

# --- Configuración MySQL con Railway ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto correcto (para MySQL 8)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Auto crear/actualizar tablas
spring.jpa.hibernate.ddl-auto=update
